name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The job name is the required status check in branch protection; keep it stable.
    name: lint · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    # Postgres for the database tests (#24): the budget ledger's concurrency test runs against it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rabbithole
          POSTGRES_PASSWORD: rabbithole
          POSTGRES_DB: rabbithole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rabbithole"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Database tests (Postgres)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://rabbithole:rabbithole@localhost:5432/rabbithole

      # Local embedding model (~23 MB from Hugging Face) and the pool's embeddings.
      - name: Cache embeddings
        uses: actions/cache@v4
        with:
          path: |
            data/models
            data/embeddings
          key: embeddings-${{ hashFiles('src/lib/rank/embed.ts') }}-${{ hashFiles('eval/rank/pool.json') }}
          restore-keys: embeddings-${{ hashFiles('src/lib/rank/embed.ts') }}-

      # Offline and free: frozen pool, plans and labels; fails on a > 0.02 drop vs eval/rank/baseline.json.
      - name: Ranking eval
        run: npm run eval:rank -- --check

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Tests run on the runner's preinstalled Google Chrome (channel "chrome"),
      # so there's no Playwright browser download to cache. Every API the UI
      # calls is mocked in e2e/fixtures.ts: no arXiv or Claude traffic.
      - name: Check Chrome
        run: google-chrome --version

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Flake report
        if: always()
        run: node scripts/ci/flake-report.mjs test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
