name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The job name is the required status check in branch protection; keep it stable.
    name: lint · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Tests run on the runner's preinstalled Google Chrome (channel "chrome"),
      # so there's no Playwright browser download to cache. Every API the UI
      # calls is mocked in e2e/fixtures.ts: no arXiv or Claude traffic.
      - name: Check Chrome
        run: google-chrome --version

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Flake report
        if: always()
        run: node scripts/ci/flake-report.mjs test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
