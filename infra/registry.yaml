AWSTemplateFormatVersion: "2010-09-09"
Description: Rabbithole container registry (deployed before the app stack, which needs an image to exist).

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: rabbithole
      ImageScanningConfiguration:
        ScanOnPush: true
      # Keep storage (the one non-free item, ~$0.10/GB-month) tiny: the last 3 images are enough to roll back.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 3 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}}]}

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
